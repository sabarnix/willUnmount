<div class="chips-wrap">
  <input type="checkbox" id="chip-toggle" class="chip-toggle-input" />
  <ul class="chips" id="chips-list">
    <li>alpha</li>
    <li>bravo</li>
    <li>charlie</li>
    <li>delta</li>
    <li>echo</li>
    <li>foxtrot</li>
    <li>golf</li>
    <li>hotel</li>
    <li class="more">
      <label for="chip-toggle">
        <span class="show-more"></span>
        <span class="show-less">Show less</span>
      </label>
    </li>
  </ul>
  <form class="chip-add" id="chip-add-form">
    <input type="text" id="chip-add-input" placeholder="Add a tag…" />
    <button type="submit">Add tag</button>
  </form>
</div>
