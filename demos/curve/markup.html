<div class="no-support" hidden>
  Your browser doesn't support <code>sibling-index()</code> and <code>sibling-count()</code> yet.
</div>
<div class="curve" data-requires="sibling" id="curve">
  <table class="curve__table">
    <thead>
      <tr>
        <th scope="col">Student</th>
        <th scope="col">Score</th>
        <th scope="col">Grade</th>
      </tr>
    </thead>
    <tbody id="curve-body">
      <tr data-score="94">
        <td>Ada</td>
        <td class="score">
          <span class="score__track"><span class="bar" style="--value: 94"></span></span>
          <span class="score__num">94</span>
        </td>
        <td class="grade"></td>
      </tr>
      <tr data-score="88">
        <td>Grace</td>
        <td class="score">
          <span class="score__track"><span class="bar" style="--value: 88"></span></span>
          <span class="score__num">88</span>
        </td>
        <td class="grade"></td>
      </tr>
      <tr data-score="87">
        <td>Ken</td>
        <td class="score">
          <span class="score__track"><span class="bar" style="--value: 87"></span></span>
          <span class="score__num">87</span>
        </td>
        <td class="grade"></td>
      </tr>
      <tr data-score="79">
        <td>Barbara</td>
        <td class="score">
          <span class="score__track"><span class="bar" style="--value: 79"></span></span>
          <span class="score__num">79</span>
        </td>
        <td class="grade"></td>
      </tr>
      <tr data-score="71">
        <td>Edsger</td>
        <td class="score">
          <span class="score__track"><span class="bar" style="--value: 71"></span></span>
          <span class="score__num">71</span>
        </td>
        <td class="grade"></td>
      </tr>
      <tr data-score="62">
        <td>Alan</td>
        <td class="score">
          <span class="score__track"><span class="bar" style="--value: 62"></span></span>
          <span class="score__num">62</span>
        </td>
        <td class="grade"></td>
      </tr>
    </tbody>
  </table>

  <div class="curve__actions">
    <button type="button" id="add-student" class="btn btn-sm">+ Add student</button>
    <button type="button" id="remove-student" class="btn btn-sm">− Remove last</button>
    <button type="button" id="cycle-bands" class="btn btn-sm">Curve: 4 bands</button>
  </div>
</div>
