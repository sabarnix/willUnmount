<div class="chart" id="chart">
  <div class="chart__plot" id="chart-plot">
    <div class="group">
      <div class="bar" style="--value: 62"></div>
      <div class="bar" style="--value: 30"></div>
      <div class="bar" style="--value: 15"></div>
    </div>
    <div class="group">
      <div class="bar" style="--value: 45"></div>
      <div class="bar" style="--value: 25"></div>
      <div class="bar" style="--value: 55"></div>
    </div>
    <div class="group">
      <div class="bar" style="--value: 20"></div>
      <div class="bar" style="--value: 68"></div>
      <div class="bar" style="--value: 40"></div>
    </div>
    <div class="group">
      <div class="bar" style="--value: 75"></div>
      <div class="bar" style="--value: 50"></div>
      <div class="bar" style="--value: 10"></div>
    </div>
  </div>

  <ul class="chart__legend" id="chart-legend">
    <li><span class="swatch"></span></li>
    <li><span class="swatch"></span></li>
    <li><span class="swatch"></span></li>
    <li><span class="swatch"></span></li>
  </ul>

  <div class="chart__actions">
    <button type="button" id="add-group">+ Add quarter</button>
    <button type="button" id="randomize">Randomize palette</button>
  </div>
</div>
