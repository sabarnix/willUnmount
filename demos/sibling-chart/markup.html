<div class="no-support">
  Your browser doesn't support <code>sibling-index()</code> and <code>sibling-count()</code> yet.
</div>
<div class="chart needs-sibling-fns" id="chart">
  <div class="chart__plot" id="chart-plot">
    <div class="group">
      <div class="bar" style="--value: 62"></div>
      <div class="bar" style="--value: 30"></div>
      <div class="bar" style="--value: 15"></div>
    </div>
    <div class="group">
      <div class="bar" style="--value: 45"></div>
      <div class="bar" style="--value: 25"></div>
      <div class="bar" style="--value: 55"></div>
    </div>
    <div class="group">
      <div class="bar" style="--value: 20"></div>
      <div class="bar" style="--value: 68"></div>
      <div class="bar" style="--value: 40"></div>
    </div>
    <div class="group">
      <div class="bar" style="--value: 75"></div>
      <div class="bar" style="--value: 50"></div>
      <div class="bar" style="--value: 10"></div>
    </div>
  </div>

  <ul class="chart__legend" id="chart-legend">
    <li aria-label="Group 1"><span class="swatch" aria-hidden="true"></span></li>
    <li aria-label="Group 2"><span class="swatch" aria-hidden="true"></span></li>
    <li aria-label="Group 3"><span class="swatch" aria-hidden="true"></span></li>
    <li aria-label="Group 4"><span class="swatch" aria-hidden="true"></span></li>
  </ul>

  <div class="chart__actions">
    <button type="button" id="add-group" class="btn btn-sm">+ Add group</button>
    <button type="button" id="randomize" class="btn btn-sm">Randomize palette</button>
  </div>
</div>
