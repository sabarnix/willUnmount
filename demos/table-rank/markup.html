<div class="board">
  <table class="board__table">
    <thead>
      <tr>
        <th scope="col">Rank</th>
        <th scope="col">Player</th>
        <th scope="col">Score</th>
      </tr>
    </thead>
    <tbody id="board-body">
      <tr data-score="96">
        <td class="rank"></td>
        <td>Ada</td>
        <td class="score">
          <span class="score__track"><span class="bar" style="--value: 96"></span></span>
          <span class="score__num">96</span>
        </td>
      </tr>
      <tr data-score="81">
        <td class="rank"></td>
        <td>Grace</td>
        <td class="score">
          <span class="score__track"><span class="bar" style="--value: 81"></span></span>
          <span class="score__num">81</span>
        </td>
      </tr>
      <tr data-score="74">
        <td class="rank"></td>
        <td>Ken</td>
        <td class="score">
          <span class="score__track"><span class="bar" style="--value: 74"></span></span>
          <span class="score__num">74</span>
        </td>
      </tr>
      <tr data-score="58">
        <td class="rank"></td>
        <td>Barbara</td>
        <td class="score">
          <span class="score__track"><span class="bar" style="--value: 58"></span></span>
          <span class="score__num">58</span>
        </td>
      </tr>
      <tr data-score="37">
        <td class="rank"></td>
        <td>Edsger</td>
        <td class="score">
          <span class="score__track"><span class="bar" style="--value: 37"></span></span>
          <span class="score__num">37</span>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="board__actions">
    <button type="button" id="add-row" class="btn btn-sm">+ Add player</button>
    <button type="button" id="remove-row" class="btn btn-sm">− Remove last</button>
  </div>
</div>
